services:
  uniterm-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ys-ll/uniterm-web:latest
    container_name: uniterm-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Shanghai
      - UNITERM_DATA_DIR=/data
      - UNITERM_GATEWAY_ADDR=0.0.0.0:8080
      - UNITERM_ADMIN_USER=admin
      # 首次启动请设置管理员初始密码（若留空则自动生成随机密码并打印在 docker logs 中）
      - UNITERM_ADMIN_PASSWORD=${UNITERM_ADMIN_PASSWORD:-ChangeMe_2026!}
      # 空闲用户 Worker 自动休眠回收时间（分钟）
      - UNITERM_WORKER_IDLE_MINUTES=60
      # 若通过反向代理部署，配置允许的公网访问源（逗号分隔）
      # - UNITERM_ALLOWED_ORIGINS=https://term.example.com
    volumes:
      # 持久化所有用户的独立加密配置、SSH 密钥、数据库与个人家目录
      - ./uniterm-data:/data
      # 可选：挂载宿主机 Docker Socket 以支持容器管理功能
      # - /var/run/docker.sock:/var/run/docker.sock
