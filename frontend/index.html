<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>uniTerm</title>
    <script>
      // Platform rem baseline (see style.css): macOS native baseline is
      // 13pt, so scale the rem-based UI up there. Runs before first paint
      // to avoid a flash of the wrong size.
      if (/Mac|iPhone|iPad|iPod/.test(navigator.platform)) {
        document.documentElement.classList.add('mac')
      }
      // Apply the persisted app theme before first paint (issue #1135):
      // without this the first frame renders the dark no-[data-theme]
      // default and flashes black on light themes, because applyTheme() only
      // runs after the settings IPC and the slow shell probe. Mirrors
      // resolveInitialTheme in src/utils/initialTheme.ts — keep in sync.
      var cachedTheme = null
      try {
        cachedTheme = localStorage.getItem('appTheme')
      } catch {
        // storage unavailable
      }
      var theme = cachedTheme === 'dark' || cachedTheme === 'light' || cachedTheme === 'deep-blue'
        ? cachedTheme
        : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      document.documentElement.dataset.theme = theme
      // Apply the persisted UI font baseline before first paint (falls back
      // to the platform default); the settings store re-applies the loaded
      // value once settings are in.
      try {
        const cached = parseInt(localStorage.getItem('uiFontSize') || '', 10)
        const base = Number.isFinite(cached) && cached >= 10 && cached <= 18
          ? cached
          : (/Mac|iPhone|iPad|iPod/.test(navigator.platform) ? 14 : 12)
        document.documentElement.style.fontSize = (base / 12) * 16 + 'px'
      } catch {
        // storage unavailable — html.mac CSS default still applies
      }
    </script>
</head>
<body>
<div id="app"></div>
<script src="/src/main.ts" type="module"></script>
</body>
</html>
