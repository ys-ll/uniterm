name: Commit Policy

on:
  pull_request:
    # Check every push to a PR branch, not only opened events.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the commit range query works.
          fetch-depth: 0

      - name: Validate commit authors and messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: bash scripts/check-commits.sh "$BASE_SHA" "$HEAD_SHA" "$PR_AUTHOR"
