<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <title>uniTerm</title>
  <script>
    window.__UNITERM_WEB__ = { instanceId: '', clientId: '' }
    document.documentElement.dataset.mode = 'web'
    if (/Mac|iPhone|iPad|iPod/.test(navigator.platform)) document.documentElement.classList.add('mac')
    document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
  </script>
  <style>
    html { color-scheme: light dark; font-family: system-ui, sans-serif; }
    html[data-mode="web"] body, html[data-mode="web"] body * { --wails-draggable: no-drag !important; }
  </style>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <script src="/src/web-main.ts" type="module"></script>
</body>
</html>
