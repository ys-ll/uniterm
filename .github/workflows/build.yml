name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      preview:
        description: 'Create a snapshot release (fixed tag, prerelease, rolling)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            slug: windows
          - os: ubuntu-24.04
            slug: linux-amd64
          - os: ubuntu-24.04-arm
            slug: linux-arm64
          - os: macos-latest
            slug: darwin
          - os: ubuntu-latest
            slug: android

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space (macOS)
        if: matrix.slug == 'darwin'
        run: |
          # Keep CommandLineTools — cgo/clang needs it. Only drop the big,
          # unneeded Xcode app + CoreSimulator.
          sudo rm -rf /Library/Developer/CoreSimulator
          sudo rm -rf /Applications/Xcode_*.app
          rm -rf "$HOME/.npm" "$HOME/.cache" 2>/dev/null || true
          df -h /

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies (Windows)
        if: matrix.slug == 'windows'
        shell: bash
        run: |
          NSIS_BIN="/c/Program Files (x86)/NSIS/Bin"
          export PATH="$NSIS_BIN:$PATH"
          # The Chocolatey community feed intermittently fails (HTTP 406 was
          # seen in CI); retry a few times before giving up.
          for attempt in 1 2 3 4 5; do
            choco install nsis -y && [ -f "$NSIS_BIN/makensis.exe" ] && break
            if [ "$attempt" = 5 ]; then echo "ERROR: makensis.exe not found at $NSIS_BIN after 5 attempts"; exit 1; fi
            echo "choco install nsis attempt $attempt failed; retrying in 30s..."
            sleep 30
          done
          echo "makensis: $NSIS_BIN/makensis.exe"

          UPX_VER="5.2.0"
          curl -sSfL -o /tmp/upx.zip "https://github.com/upx/upx/releases/download/v${UPX_VER}/upx-${UPX_VER}-win64.zip"
          sha256sum /tmp/upx.zip
          unzip -o /tmp/upx.zip -d /tmp/upx > /dev/null
          mv -f /tmp/upx/upx-*/upx.exe "$NSIS_BIN/upx.exe"
          upx --version

      - name: Install dependencies (Linux)
        if: startsWith(matrix.slug, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev upx pkg-config

      - name: Install dependencies (Android)
        if: matrix.slug == 'android'
        run: |
          # Same GTK packages as the desktop Linux build: only needed to
          # compile the wails3 CLI (it just orchestrates the gradle/NDK build).
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config \
            openjdk-21-jdk-headless
          # Gradle needs JAVA_HOME; pin it to the apt-installed OpenJDK 21.
          # Runner images ship a newer default JDK whose javac shadows the
          # apt one (which javac resolves there), and AGP lint cannot run on
          # it (lintVitalAnalyzeRelease dies with a bare version string).
          JAVA_HOME="/usr/lib/jvm/java-21-openjdk-amd64"
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          "$JAVA_HOME/bin/java" -version
          # GitHub runners ship the Android SDK with cmdline-tools; accept the
          # licenses and add the components the gradle/NDK build needs.
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"

      - name: Install Wails CLI (wails3)
        shell: bash
        run: |
          # setup-go does not add GOPATH/bin to PATH; wails3 (and the
          # overlay:gen / generate bindings calls inside the tasks) live there.
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          # On Linux, wails3 defaults to the WebKitGTK 6.0 (GTK4) pkg-config
          # stack, which ubuntu-24.04 does not ship. Build the CLI (and later the
          # app) with the legacy -tags gtk3 contract (WebKit2GTK 4.1). The CLI
          # only orchestrates the gradle/NDK android build, so the tag choice
          # does not affect the APK.
          TAGS=""
          if [[ "${{ matrix.slug }}" == linux* || "${{ matrix.slug }}" == "android" ]]; then TAGS="-tags gtk3"; fi
          go install $TAGS github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Set version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "VERSION=dev-${SHORT}" >> $GITHUB_ENV
          fi

      # Regenerate the gitignored build assets (build/windows/info.json +
      # manifest, darwin Info.plist, linux nfpm.yaml) from build/config.yml.
      # A fresh checkout has only icon.ico/org.wails.uniterm.desktop committed, and
      # generate:syso + app-bundle/nfpm all need these.
      - name: Update build assets
        if: matrix.slug != 'android'
        shell: bash
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          wails3 task common:update:build-assets

      ## ---- Build: wails3 compiles the binary; packaging happens below ----

      - name: Build (Windows)
        if: matrix.slug == 'windows'
        shell: bash
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          wails3 build VERSION="$VERSION"                 # bin/uniTerm.exe (amd64)
          mv bin/uniTerm.exe bin/uniTerm-amd64.exe
          wails3 build VERSION="$VERSION" ARCH=arm64      # bin/uniTerm.exe (arm64)
          mv bin/uniTerm.exe bin/uniTerm-arm64.exe
          echo "AMD64|ARM64 built:"; ls -la bin/

      - name: Build (Linux)
        if: startsWith(matrix.slug, 'linux')
        shell: bash
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          # Native CGO build on the matching-arch runner → bin/uniTerm.
          # gtk3 = legacy WebKit2GTK 4.1 stack (the only one ubuntu-24.04 provides).
          pkg-config --modversion webkit2gtk-4.1
          wails3 build GOOS=linux VERSION="$VERSION" EXTRA_TAGS=gtk3
          chmod +x bin/uniTerm
          echo "Linux binary:"; ls -la bin/uniTerm

      - name: Build (macOS)
        if: matrix.slug == 'darwin'
        shell: bash
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          # Universal binary (arm64 + amd64 via lipo); then a per-arch .app
          # bundle from Info.plist. Each single-arch .app is what gets packaged
          # into its own dmg below (matches the v1.8.0 single-arch dmgs).
          wails3 task darwin:build:universal VERSION="$VERSION"
          for arch in amd64 arm64; do
            cp "bin/uniTerm-$arch" bin/uniTerm
            wails3 task darwin:create:app:bundle
            mv bin/uniTerm.app "bin/uniTerm-$arch.app"
          done
          ls -la bin/uniTerm-amd64.app/Contents/MacOS bin/uniTerm-arm64.app/Contents/MacOS

          # Self-update payloads: bare app-bundle binary per arch, matching
          # what the in-app updater downloads, verifies and ad-hoc re-signs.
          # -j junk-paths so the zip root holds just the "uniTerm" executable.
          for arch in amd64 arm64; do
            zip -q -j "uniterm-darwin-${arch}-${VERSION}.zip" \
              "bin/uniTerm-${arch}.app/Contents/MacOS/uniTerm"
          done
          ls -la uniterm-darwin-*.zip

      - name: Build (Android)
        if: matrix.slug == 'android'
        shell: bash
        env:
          # Release keystore as base64; decoded below. Without it gradle
          # signs with the per-runner debug keystore, whose signature is
          # different on every ephemeral runner and blocks upgrade installs.
          ANDROID_KEYSTORE_FILE_B64: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # main.go embeds all:frontend/dist; neither dist nor the generated
          # bindings are committed, so build the frontend first (this also
          # covers the embed needed by android:package below).
          wails3 task common:build:frontend
          # arm64 covers virtually all real devices; amd64 is only useful for
          # local emulator builds, so CI always packages arm64.
          # PRODUCTION must be passed explicitly: android:package declares
          # PRODUCTION=true on its internal build dep, but the value is lost
          # on the build -> compile:go:shared hop, silently producing a
          # -tags android,debug library (broken WebView asset serving).
          if [ -n "${ANDROID_KEYSTORE_FILE_B64:-}" ]; then
            KS="$GITHUB_WORKSPACE/uniterm-release.keystore"
            echo "$ANDROID_KEYSTORE_FILE_B64" | base64 -d > "$KS"
            export ANDROID_KEYSTORE_FILE="$KS"
            echo "Signing with release keystore (alias: $ANDROID_KEY_ALIAS)"
          else
            echo "WARNING: no ANDROID_KEYSTORE_FILE secret — falling back to the runner debug keystore"
          fi
          wails3 task android:package PRODUCTION=true
          # Match the desktop convention: uniterm-<os>-<arch>-<version>.apk.
          # Stage at the workspace root: the Upload artifact step globs
          # uniterm-*.apk there, so a copy left under bin/ matches nothing
          # and no artifact gets uploaded (only a warning is emitted).
          mv bin/uniTerm.apk "uniterm-android-arm64-${VERSION}.apk"
          ls -la uniterm-android-*.apk

      - name: Package (macOS)
        if: matrix.slug == 'darwin'
        run: |
          # One dmg per arch. Stage under GITHUB_WORKSPACE (the large "/"
          # volume) rather than /tmp: the hosted runner's /tmp is a small,
          # separate volume and hdiutil regularly ran out of space there for a
          # large .app. Fall back to a zipped .app when hdiutil still fails.
          for arch in amd64 arm64; do
            APP="bin/uniTerm-$arch.app"
            chmod +x "$APP/Contents/MacOS/uniTerm"

            STAGE="${{ github.workspace }}/dmg_staging_${arch}"
            mkdir -p "$STAGE"
            cp -R "$APP" "$STAGE/uniTerm.app"
            ln -s /Applications "$STAGE/Applications"
            if hdiutil create -volname uniTerm -srcfolder "$STAGE" -ov -format UDZO "uniterm-darwin-${arch}-${VERSION}.dmg"; then
              echo "dmg created ($arch)"
            else
              # Same filename as the bare-binary zip above — the fallback
              # overwrites it with a full .app, which is both manually
              # installable and a valid in-app update payload (the updater
              # picks the executable out of the bundle by name).
              echo "hdiutil dmg failed ($arch) — shipping zipped .app instead"
              rm -f "uniterm-darwin-${arch}-${VERSION}.zip"
              ditto -c -k --sequesterRsrc --keepParent "$APP" "uniterm-darwin-${arch}-${VERSION}.zip"
            fi
            rm -rf "$STAGE"
          done

      ## ---- Package (kept per-platform; v2 NSIS installer feeds the v3 binaries) ----

      - name: Download VcXsrv (Windows)
        if: startsWith(matrix.slug, 'windows')
        shell: pwsh
        env:
          VCXSRV_VERSION: v1.0.0
        run: |
          $VCXSRV_DIR = Join-Path $env:GITHUB_WORKSPACE 'build\windows\installer\plugins\vcxsrv'
          New-Item -ItemType Directory -Force -Path $VCXSRV_DIR | Out-Null
          $zip = Join-Path $env:TEMP 'vcxsrv.zip'
          Invoke-WebRequest -Uri "https://github.com/ys-ll/uniterm-vcxsrv/releases/download/$env:VCXSRV_VERSION/vcxsrv.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $VCXSRV_DIR -Force
          Get-ChildItem $VCXSRV_DIR

      - name: Package (Windows, v2 NSIS installer)
        if: startsWith(matrix.slug, 'windows')
        shell: pwsh
        run: |
          $env:Path = "C:\Program Files (x86)\NSIS\Bin;$env:Path"
          $VERSION = "${{ env.VERSION }}"
          $ROOT = $env:GITHUB_WORKSPACE
          $AMD64_BIN = Join-Path $ROOT 'bin\uniTerm-amd64.exe'
          $ARM64_BIN = Join-Path $ROOT 'bin\uniTerm-arm64.exe'
          $NSI = Join-Path $ROOT 'build\windows\installer\project.nsi'

          # compress amd64 with upx; arm64 is left uncompressed because
          # UPX 5.2.0 can't pack the PE section structure that Wails'
          # WebView2Loader produces for windows/arm64
          upx --best --lzma $AMD64_BIN

          $VCXSRV_DIR = Join-Path $ROOT 'build\windows\installer\plugins\vcxsrv'

          # project.nsi's OutFile is ..\..\bin\... installers into build\bin,
          # which v3 never creates (it outputs to bin/). Ensure it exists.
          New-Item -ItemType Directory -Force -Path (Join-Path $ROOT 'build\bin') | Out-Null

          & makensis "-DVERSION=$VERSION" "-DARG_WAILS_AMD64_BINARY=$AMD64_BIN" "-DVCXSRV_DIR=$VCXSRV_DIR" $NSI
          & makensis "-DVERSION=$VERSION" "-DARG_WAILS_ARM64_BINARY=$ARM64_BIN" "-DVCXSRV_DIR=$VCXSRV_DIR" $NSI

          foreach ($arch in @('amd64', 'arm64')) {
            $srcExe = Join-Path $ROOT "bin\uniTerm-$arch.exe"
            $srcInstaller = Join-Path $ROOT "build\bin\uniTerm-$arch-installer.exe"

            # portable zip
            New-Item -ItemType Directory -Force -Path dist_tmp | Out-Null
            Copy-Item $srcExe "dist_tmp\uniTerm.exe"
            Copy-Item -Recurse $VCXSRV_DIR "dist_tmp\plugins\vcxsrv"
            Compress-Archive -Path dist_tmp\* -DestinationPath "uniterm-windows-$arch-portable-$VERSION.zip" -Force
            Remove-Item -Recurse -Force dist_tmp

            # rename NSIS installer
            Move-Item $srcInstaller "uniterm-windows-$arch-installer-$VERSION.exe"
          }

      - name: Package (Linux, nfpm)
        if: startsWith(matrix.slug, 'linux')
        run: |
          ARCH=${{ matrix.slug == 'linux-amd64' && 'amd64' || 'arm64' }}
          NFPM_ARCH=${{ matrix.slug == 'linux-amd64' && 'x86_64' || 'arm64' }}
          upx --best --lzma bin/uniTerm

          cd bin
          tar czf ../uniterm-linux-${ARCH}-${VERSION}.tar.gz uniTerm
          cd ..

          NFPM_VER="2.46.3"
          curl -sSfL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VER}/nfpm_${NFPM_VER}_Linux_${NFPM_ARCH}.tar.gz"
          tar xf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
          chmod +x /usr/local/bin/nfpm

          cat > nfpm.yaml << EOF
          name: uniterm
          arch: ${ARCH}
          platform: linux
          version: ${VERSION}
          maintainer: uniTerm <uniTerm@uniterm.net>
          description: Lightweight all-in-one terminal emulator with built-in AI Agent
          homepage: https://uniterm.net
          license: Proprietary
          depends:
            - libgtk-3-0
            - libwebkit2gtk-4.1-0
          overrides:
            rpm:
              depends:
                - gtk3
                - webkit2gtk4.1
          contents:
            - src: bin/uniTerm
              dst: /usr/bin/uniterm
            - src: build/linux/org.wails.uniterm.desktop
              dst: /usr/share/applications/org.wails.uniterm.desktop
            - src: build/linux/icons/hicolor
              dst: /usr/share/icons/hicolor
          EOF

          nfpm package --config nfpm.yaml --packager deb \
            --target "uniterm-linux-${ARCH}-${VERSION}.deb"
          nfpm package --config nfpm.yaml --packager rpm \
            --target "uniterm-linux-${ARCH}-${VERSION}.rpm"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: uniTerm-${{ matrix.slug }}
          # Fail loudly instead of silently uploading nothing when the
          # globs below miss (an empty artifact previously hid a lost APK).
          if-no-files-found: error
          path: |
            uniterm-*.zip
            uniterm-*.tar.gz
            uniterm-*.exe
            uniterm-*.dmg
            uniterm-*.deb
            uniterm-*.rpm
            uniterm-*.apk

  release:
    needs: [build, docker]
    # Tag pushes and manual preview runs release. A casual manual run (no
    # preview checkbox) skips the docker job; the desktop release must still
    # go out in that case.
    if: |
      ${{ !cancelled() && needs.build.result == 'success' &&
      (needs.docker.result == 'success' || needs.docker.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.preview == true)) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect release files
        run: |
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.apk' \) -exec mv {} . \;
          ls -la uniterm-*
          # checksums.txt powers the in-app updater's SHA256 verification.
          # sync-gitee.yml mirrors it to Gitee together with the assets.
          sha256sum uniterm-* > checksums.txt
          cat checksums.txt

      - name: Determine release mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "PRERELEASE=true" >> $GITHUB_ENV
          fi

      - name: Extract changelog
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            SHA="${{ github.sha }}"
            SHORT=$(echo "$SHA" | cut -c1-7)
            NOW=$(date -u +"%Y-%m-%d %H:%M UTC")
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            cat > release_body.md <<EOF
          ## ⚠️ Preview Release / 预览版本

          This is a **preview/prerelease** build, **not an official release**. Do not distribute.
          本次为**预览构建，非正式发布版本**，请勿对外分发。

          - Commit: \`${SHORT}\`
          - Branch: \`${{ github.ref_name }}\`
          - Built: ${NOW}
          - Run: ${RUN_URL}
          EOF
          else
            sed -n "/^## ${{ github.ref_name }}$/,/^## v/p" CHANGELOG.md | sed '$d' > release_body.md
          fi

      - name: Detect prerelease
        if: github.event_name != 'workflow_dispatch'
        run: |
          if echo "${{ github.ref_name }}" | grep -qiE '\-(rc|beta|alpha|pre|dev)'; then
            echo "PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "PRERELEASE=false" >> $GITHUB_ENV
          fi

      - name: Update snapshot tag
        if: github.event_name == 'workflow_dispatch' && inputs.preview == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f main-snapshot
          git push -f origin main-snapshot

      - name: Download docker image archives
        if: github.event_name == 'push' || inputs.preview == true
        uses: actions/download-artifact@v4
        with:
          name: docker-image-archives

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && 'main-snapshot' || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && 'Main Snapshot' || github.ref_name }}
          prerelease: ${{ env.PRERELEASE == 'true' }}
          body_path: release_body.md
          files: |
            uniterm-*.zip
            uniterm-*.tar.gz
            uniterm-*.exe
            uniterm-*.dmg
            uniterm-*.deb
            uniterm-*.rpm
            uniterm-*.apk
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
  ## ---- Docker image: amd64 + arm64, pushed to Docker Hub ----
  ## Tag pushes (v*) publish <version> + latest; manual runs publish the
  ## dev-<sha> tag only when the preview checkbox is set — latest always
  ## points at an official release.
  docker:
    if: github.event_name == 'push' || inputs.preview == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "VERSION=dev-${SHORT}" >> $GITHUB_ENV
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        shell: bash
        run: |
          # Docker tags conventionally drop the leading v of the git tag.
          IMG=uniterm/uniterm
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "IMAGE_TAGS=${IMG}:${VERSION#v},${IMG}:latest" >> $GITHUB_ENV
          else
            echo "IMAGE_TAGS=${IMG}:${VERSION}" >> $GITHUB_ENV
          fi

      - name: Build and push
        if: github.event_name == 'push' || inputs.preview == true
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ env.IMAGE_TAGS }}

      - name: Save image archives for offline import
        shell: bash
        run: |
          # First published tag (dev-<sha>, or the version tag without v).
          FIRST_TAG="${IMAGE_TAGS%%,*}"
          FIRST_TAG="${FIRST_TAG#uniterm/uniterm:}"
          for arch in amd64 arm64; do
            docker pull --platform="linux/$arch" "uniterm/uniterm:${FIRST_TAG}"
            docker save "uniterm/uniterm:${FIRST_TAG}" | gzip > "uniterm-docker-${arch}-${VERSION}.tar.gz"
          done
          ls -la uniterm-docker-*.tar.gz

      - name: Upload image archives
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-archives
          path: uniterm-docker-*.tar.gz
          retention-days: 1
          if-no-files-found: error
